<!--
  StockIn brand mark (carton + location pin, blue-to-violet gradient).
  Same artwork as src/components/ui/LogoIcon.jsx, which renders it in the app
  header. Browsers require the favicon as a standalone file, so the markup is
  deliberately duplicated - if you change one, change both.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 230" role="img" aria-label="StockIn">
  <title>StockIn</title>
  <defs>
    <linearGradient id="boxStroke" x1="30" y1="36" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E86FF"/>
      <stop offset="0.55" stop-color="#5B6BF5"/>
      <stop offset="1" stop-color="#8A2FE3"/>
    </linearGradient>
    <linearGradient id="pinStroke" x1="118" y1="88" x2="180" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#7C2FE0"/>
    </linearGradient>
    <linearGradient id="pinDot" x1="134" y1="112" x2="170" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- Hide the carton artwork where the location pin overlaps it -->
    <mask id="pinCutout" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="230" height="230">
      <rect width="230" height="230" fill="#fff"/>
      <circle cx="152" cy="130" r="42" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke="url(#boxStroke)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" mask="url(#pinCutout)">
    <!-- carton body + lid -->
    <rect x="30" y="36" width="126" height="122" rx="13"/>
    <path d="M30 62h126"/>
    <!-- sealing tab -->
    <path d="M82 36v12a4 4 0 0 0 4 4h14a4 4 0 0 0 4-4V36"/>
    <!-- label lines -->
    <path d="M45 114h46"/>
    <path d="M45 130h28"/>
  </g>

  <!-- location pin -->
  <path
    d="M152 198c-8-16-42-44-42-68a42 42 0 1 1 84 0c0 24-34 52-42 68Z"
    fill="none"
    stroke="url(#pinStroke)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="152" cy="130" r="20" fill="url(#pinDot)"/>
</svg>